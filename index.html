<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おすすめスポット帳</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>📍 おすすめスポット帳</h1>
  <form id="form">
    <input id="name" placeholder="お店・場所の名前" required>
    <input id="area" placeholder="エリア（例：下北沢）">
    <textarea id="comment" rows="3" placeholder="おすすめポイント"></textarea>
    <button>投稿する</button>
  </form>
  <div id="list"></div>
</main>
<script src="script.js"></script>
</body>
</html>
