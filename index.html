<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おすすめスポット帳</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1><img src="logo.png" alt="GOHANOTE" class="logo"></h1>
  <form id="form">
    <input id="name" placeholder="お店・場所の名前" required>
    <input id="area" placeholder="エリア（例：下北沢）">
    <textarea id="comment" rows="3" placeholder="おすすめポイント"></textarea>
    <button>投稿する</button>
  </form>

  <!-- タブ切り替えを追加 -->
  <nav class="tabs">
    <button type="button" id="tab-all" class="tab-btn active" onclick="switchTab('all')">すべての投稿</button>
    <button type="button" id="tab-liked" class="tab-btn" onclick="switchTab('liked')">いいね一覧</button>
    <button type="button" id="tab-want" class="tab-btn" onclick="switchTab('want')">行きたい！</button>
  </nav>

  <div id="list"></div>
</main>
<script src="script.js"></script>
</body>
</html>
